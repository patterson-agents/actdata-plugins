# Claude Code in GitLab CI: Amazon Bedrock over OIDC.
#
# No static AWS keys. GitLab mints the job's OIDC token from the id_tokens:
# block and exposes it as GITLAB_OIDC_TOKEN; the job exchanges it for temporary
# credentials at runtime.
#
# Prerequisites:
#   - Bedrock enabled with access to the chosen Claude models
#   - GitLab configured as an OIDC identity provider in AWS IAM
#   - An IAM role with Bedrock permissions whose trust policy is restricted to
#     your project and protected refs
#
# Required CI/CD variables:
#   AWS_ROLE_TO_ASSUME   ARN of the IAM role
#   AWS_REGION           Bedrock region, for example us-west-2
#
# Set `aud` to the audience value configured on the IAM OIDC identity provider
# in AWS, typically your GitLab instance URL.

stages:
  - ai

claude-bedrock:
  stage: ai
  image: node:24-alpine3.21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.example.com
  before_script:
    - apk add --no-cache bash curl jq git aws-cli
    - curl -fsSL https://claude.ai/install.sh | bash
    # The installer places claude in ~/.local/bin, which isn't on PATH in this image
    - export PATH="$HOME/.local/bin:$PATH"
    # Exchange the job's OIDC token for AWS credentials
    - export AWS_WEB_IDENTITY_TOKEN_FILE="/tmp/oidc_token"
    - printf "%s" "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - >
      aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_TO_ASSUME"
      --role-session-name "gitlab-claude-$(date +%s)"
      --web-identity-token "file://$AWS_WEB_IDENTITY_TOKEN_FILE"
      --duration-seconds 3600 > /tmp/aws_creds.json
    - export AWS_ACCESS_KEY_ID="$(jq -r .Credentials.AccessKeyId /tmp/aws_creds.json)"
    - export AWS_SECRET_ACCESS_KEY="$(jq -r .Credentials.SecretAccessKey /tmp/aws_creds.json)"
    - export AWS_SESSION_TOKEN="$(jq -r .Credentials.SessionToken /tmp/aws_creds.json)"
  script:
    - /bin/gitlab-mcp-server || true
    - >
      claude
      -p "${AI_FLOW_INPUT:-'Implement the requested changes and open an MR'}"
      --permission-mode acceptEdits
      --allowedTools "Bash Read Edit Write mcp__gitlab"
      --debug
  variables:
    AWS_REGION: "us-west-2"
    CLAUDE_CODE_USE_BEDROCK: "1"

# Bedrock model IDs carry region-specific prefixes, for example
# us.anthropic.claude-opus-5. Pass the model through your job configuration
# or the prompt if the workflow supports it.
#
# Note: the paths above are inside the ephemeral job container, which is
# destroyed when the job ends. They are not host paths.
