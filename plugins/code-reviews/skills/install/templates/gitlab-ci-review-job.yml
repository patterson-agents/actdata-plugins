# Automated code review on every merge request.
#
# Add to .gitlab-ci.yml, adapting `stage:` to the project's existing stages, and
# install the two companion files:
#   .gitlab/code-review-prompt.md   from templates/gitlab-code-review-prompt.md
#   .gitlab/post-review-thread.sh   from templates/gitlab-post-review-thread.sh
#                                   (chmod +x)
#
# The prompt is a separate file so what the reviewer is told stays reviewable
# and tunable in merge requests of its own, rather than buried in shell quoting.
# The script is the reviewer's only write access: it posts one discussion on the
# merge request in scope and nothing else, so the untrusted diff it reads cannot
# reach the rest of the API with the project access token.
#
# CI/CD variables to create under Settings > CI/CD > Variables, both masked:
#   ANTHROPIC_API_KEY     the Claude API key (required)
#   GITLAB_ACCESS_TOKEN   project access token with the api scope (optional).
#                         With it, findings post to the merge request via glab;
#                         without it, the review prints to the job log only,
#                         because CI_JOB_TOKEN cannot create merge request notes.
# For Amazon Bedrock or Google Cloud instead, see gitlab-ci.md.
#
# Do not expose these variables to pipelines from forks.
#
# Duo-enabled runner images ship /bin/gitlab-mcp-server and can use the
# mcp__gitlab tools instead of glab; standard Docker runners do not have that
# binary, which is why this template posts through glab.

.code-review-base:
  stage: test
  image: node:24-alpine3.21
  variables:
    GIT_DEPTH: "0"
    # blocking: post only what blocks the merge. all: every severity.
    REVIEW_DEPTH: "blocking"
    GLAB_VERSION: "1.113.0"
    GLAB_SHA256_AMD64: "c265589fb2018f310b6a27df9356efee42991f858e7e3a5fa232228a13b47467"
    GLAB_SHA256_ARM64: "0c4cab3b35f7641e7955492b9491d7070698a958f0dfcb49d989e71bd78793c2"
    # glab authenticates from GITLAB_ACCESS_TOKEN automatically; on a
    # self-managed instance it also needs the host.
    GITLAB_HOST: "$CI_SERVER_HOST"
    # Review cost and latency knobs. Sonnet at medium effort reviews a typical
    # merge request in about a minute; raise to claude-opus-5 / high for a
    # deeper pass, or run one from the pipeline UI when a change warrants it.
    CLAUDE_MODEL: "claude-sonnet-5"
    CLAUDE_EFFORT: "medium"
    CLAUDE_MAX_BUDGET_USD: "1.00"
  before_script:
    - apk add --no-cache git bash curl jq
    - mkdir -p .tmp
    # Alpine's packaged glab lags far behind releases; install a pinned,
    # checksum-verified build from the official release, matching the runner's
    # architecture rather than assuming amd64.
    - |
      case "$(uname -m)" in
        x86_64)  GLAB_ARCH=amd64; GLAB_SHA256="$GLAB_SHA256_AMD64" ;;
        aarch64) GLAB_ARCH=arm64; GLAB_SHA256="$GLAB_SHA256_ARM64" ;;
        *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL -o .tmp/glab.tar.gz "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_${GLAB_ARCH}.tar.gz"
      echo "${GLAB_SHA256}  .tmp/glab.tar.gz" | sha256sum -c -
      tar -xzf .tmp/glab.tar.gz -C /usr/local bin/glab
    # The npm registry install carries integrity metadata, unlike a piped script.
    - npm install -g @anthropic-ai/claude-code
  script:
    - |
      # Branch names reach the model's prompt; reject anything outside a
      # conservative character set rather than forwarding attacker-shaped input.
      case "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" in
        *[!A-Za-z0-9._/-]*) echo "branch name outside [A-Za-z0-9._/-]; refusing to review"; exit 1 ;;
      esac
      # Both jobs run only in merge request pipelines, where these are set. A
      # pipeline started any other way has no merge request to review.
      if [ -z "${CI_MERGE_REQUEST_IID:-}" ]; then
        echo "no merge request in scope; nothing to review."
        exit 0
      fi

      if [ "$REVIEW_DEPTH" = "all" ]; then
        POSTING_MODE="thorough - post findings at any severity"
      else
        POSTING_MODE="blocking-only"
      fi

      if [ -n "${GITLAB_ACCESS_TOKEN:-}" ]; then
        DIFF_REFS=$(glab api "projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID" | jq -c .diff_refs)
      else
        DIFF_REFS=""
        POSTING_MODE="no posting credentials in this job - print the review to stdout and state plainly that nothing was posted"
      fi

      {
        echo "Merge request: !$CI_MERGE_REQUEST_IID ($CI_MERGE_REQUEST_SOURCE_BRANCH_NAME into $CI_MERGE_REQUEST_TARGET_BRANCH_NAME)"
        echo "Project id: $CI_PROJECT_ID"
        echo "Diff refs: $DIFF_REFS"
        echo "Posting mode: $POSTING_MODE"
        echo
        cat .gitlab/code-review-prompt.md
      } > .tmp/review-prompt.md

      # The reviewer's only write access is .gitlab/post-review-thread.sh, which
      # posts one discussion on this merge request and nothing else. The diff it
      # reads is untrusted input, so it must not hold a general `glab api`.
      DIFF_REFS="$DIFF_REFS" \
      claude \
        -p "$(cat .tmp/review-prompt.md)" \
        --model "$CLAUDE_MODEL" \
        --effort "$CLAUDE_EFFORT" \
        --max-budget-usd "$CLAUDE_MAX_BUDGET_USD" \
        --allowedTools "Read Grep Glob Write Bash(git diff:*) Bash(git log:*) Bash(jq:*) Bash(sha1sum:*) Bash(.gitlab/post-review-thread.sh:*)" \
        --max-turns 25
  # Bounds a task that turns out harder than expected.
  timeout: 20m
  # A probabilistic reviewer must never block a merge.
  allow_failure: true
  # A new push supersedes an in-flight review.
  interruptible: true

# The automatic pass on every merge request. Quiet by design: only findings that
# block the merge are posted, so the review stays something people leave on.
code-review:
  extends: .code-review-base
  rules:
    # Draft merge requests are not reviewed. CI_MERGE_REQUEST_DRAFT needs
    # GitLab 17.10+; the title check covers older instances.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^Draft:/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# The deep pass, one click from the merge request's pipeline widget when a
# change warrants it. Reports at every severity.
code-review:deep:
  extends: .code-review-base
  variables:
    REVIEW_DEPTH: "all"
    CLAUDE_EFFORT: "high"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
