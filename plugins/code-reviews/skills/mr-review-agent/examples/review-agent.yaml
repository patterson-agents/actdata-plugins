# docker-agent configuration for automated merge-request review.
#
# Copied into a target repository (conventionally .gitlab/codereview/) by the
# setup-mr-review command. The full review rubric and the diff arrive in the
# prompt built by post-mr-review.ts / codereview.sh; this file sets the model,
# the persona, and -- deliberately -- a read-only toolset.
#
# SECURITY: the diff under review is untrusted input to the model. This agent
# runs unattended, so its capabilities are bounded here, not by approval
# prompts: filesystem reads and one fixed git command, no shell, no network,
# no MCP. Widening this toolset widens what a prompt-injected review can do.

agents:
  root:
    # REQUIRED: replace with the model for the chosen provider, and set the
    # provider's API key as a masked CI/CD variable. Examples:
    #
    #   model: anthropic/claude-opus-5         # ANTHROPIC_API_KEY; recommended default
    #   model: anthropic/claude-sonnet-5       # ANTHROPIC_API_KEY; lower cost
    #   model: anthropic/claude-fable-5        # ANTHROPIC_API_KEY
    #   model: openai/gpt-5.6-sol              # OPENAI_API_KEY
    #
    # Local models work through Docker Model Runner with a dmr/ model string.
    # Provider list: https://docker.github.io/docker-agent/providers/overview/
    model: REPLACE_ME

    instruction: |
      Act as a senior engineer reviewing a merge request. The prompt contains
      the review rubric, the merge request context, and the diff. Follow the
      rubric exactly: review only changed lines, report only concrete defects,
      and use the blocker/warning/nit severity scale as defined.

      Read surrounding files only when needed to judge a changed line, and
      never modify anything.

      Respond with only the findings-contract JSON object described in the
      rubric. No prose before or after it.

    toolsets:
      - type: filesystem
        tools: ["read_file", "search_files_content"]
      - type: script
        shell:
          recent_history:
            description: The last 30 commits, for context on churn and intent
            cmd: git log --oneline -n 30
