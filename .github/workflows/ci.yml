name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/check-size.ts and check-no-binaries.ts read tracked files via
          # `git ls-files`, and scripts/tests/run-tests.sh creates throwaway git repos.
          # A full checkout keeps both honest.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # devDependencies only (a YAML parser for the template-parse suite); the
      # validators themselves are dependency-free and run before this matters.
      - name: Install dev dependencies
        run: npm ci

      - name: Run the repository gate battery
        run: sh scripts/verify-all.sh

      # Advisory rather than gating: the CLI arrives over the network at job
      # time, so a registry or CDN hiccup must not block the real gate above.
      - name: Validate marketplace manifest (claude plugin validate)
        continue-on-error: true
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          claude plugin validate .
