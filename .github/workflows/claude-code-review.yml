name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes an in-flight review rather than paying for both.
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork pull requests receive no secrets and a read-only token, so skip
    # them rather than failing with an empty API key.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/patterson-agents/actdata-plugins.git'
          plugins: 'code-reviews@actdata-plugins'
          # --comment is what makes findings post. Without it the review runs
          # and writes to the workflow log only.
          prompt: '/code-reviews:review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The action starts the inline-comment MCP server only when
          # --allowedTools names it here, even though the skill's own
          # frontmatter also allows it.
          claude_args: >-
            --allowedTools "Read Grep Glob mcp__github_inline_comment__create_inline_comment"
            --max-turns 25
