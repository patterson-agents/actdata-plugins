# GitLab CI mirror of .github/workflows/ci.yml, plus the merge-request review job.
#
# The verify jobs call the same entry point as GitHub CI, scripts/verify-all.sh,
# which is the single definition of every mechanical invariant in this
# repository. Keep the two in step: a check that exists in only one of them will
# be discovered by whoever is unlucky enough to push to the other.

stages:
  - verify
  - review

verify-all:
  stage: verify
  image: node:24-alpine3.21
  variables:
    # scripts/check-size.ts and check-no-binaries.ts read tracked files via
    # `git ls-files`, and the test suites create throwaway git repositories
    # under .tmp/. A full clone keeps both honest, the same reason the GitHub
    # workflow sets fetch-depth: 0.
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    # The node alpine image is minimal; verify-all.sh and the suites it
    # discovers need git and a POSIX shell.
    - apk add --no-cache git
    # devDependencies only (a YAML parser for the template-parse suite); the
    # validators themselves are dependency-free.
    - npm ci
  script:
    - sh scripts/verify-all.sh

# Advisory rather than gating: the CLI arrives over the network at job time, so
# a registry or CDN hiccup must not block a merge the verify-all job already
# vouches for.
validate-manifest:
  stage: verify
  image: node:24-alpine3.21
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    # The npm registry install carries integrity metadata, unlike a piped script.
    - npm install -g @anthropic-ai/claude-code
  script:
    - claude plugin validate .

# Automated code review on every non-draft merge request.
#
# CI/CD variables under Settings > CI/CD > Variables, both masked:
#   ANTHROPIC_API_KEY     the Claude API key (required)
#   GITLAB_ACCESS_TOKEN   project access token with the api scope (optional).
#                         With it, findings post to the merge request via glab;
#                         without it, the review prints to the job log only,
#                         because CI_JOB_TOKEN cannot create merge request notes.
# Do not expose these variables to pipelines from forks.
#
# The /bin/gitlab-mcp-server binary that GitLab's Duo-enabled runner images
# provide is not present on standard Docker runners, so this job posts through
# glab instead of the mcp__gitlab tools.
code-review:
  stage: review
  image: node:24-alpine3.21
  rules:
    # Draft merge requests are not reviewed. CI_MERGE_REQUEST_DRAFT needs
    # GitLab 17.10+; the title check covers older instances.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^Draft:/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
    GLAB_VERSION: "1.113.0"
    GLAB_SHA256: "c265589fb2018f310b6a27df9356efee42991f858e7e3a5fa232228a13b47467"
    # glab authenticates from GITLAB_ACCESS_TOKEN automatically; on a
    # self-managed instance it also needs the host.
    GITLAB_HOST: "$CI_SERVER_HOST"
  before_script:
    - apk add --no-cache git bash curl
    # Alpine's packaged glab lags far behind releases; install a pinned,
    # checksum-verified build from the official release.
    - curl -fsSL -o /tmp/glab.tar.gz "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.tar.gz"
    - echo "${GLAB_SHA256}  /tmp/glab.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/glab.tar.gz -C /usr/local bin/glab
    # The npm registry install carries integrity metadata, unlike a piped script.
    - npm install -g @anthropic-ai/claude-code
  script:
    - |
      # Branch names reach the model's prompt; reject anything outside a
      # conservative character set rather than forwarding attacker-shaped input.
      case "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" in
        *[!A-Za-z0-9._/-]*) echo "branch name outside [A-Za-z0-9._/-]; refusing to review"; exit 1 ;;
      esac
      if [ -n "${GITLAB_ACCESS_TOKEN:-}" ]; then
        POSTING="Post each finding on merge request !$CI_MERGE_REQUEST_IID with 'glab mr note create $CI_MERGE_REQUEST_IID --message ...', one note per unique issue, then a summary note."
      else
        POSTING="No posting credentials are available in this job, so print the full review to stdout and state clearly that nothing was posted."
      fi
      claude \
        -p "Review merge request !$CI_MERGE_REQUEST_IID (branch $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME against $CI_MERGE_REQUEST_TARGET_BRANCH_NAME) following the guidance in REVIEW.md and ACT_CODE_REVIEW.md, including any file they reference with @. Diff the merge request with git. Report only findings that name a concrete failure scenario and cite path:line. $POSTING Modify no files." \
        --allowedTools "Read Grep Glob Bash(git diff:*) Bash(git log:*) Bash(git fetch:*) Bash(glab mr note:*) Bash(glab mr view:*) Bash(glab mr diff:*)" \
        --max-turns 25
  # Bounds a task that turns out harder than expected.
  timeout: 20m
  # A probabilistic reviewer must never block a merge.
  allow_failure: true
  # A new push supersedes an in-flight review.
  interruptible: true
