# GitLab CI mirror of .github/workflows/ci.yml, plus the merge-request review job.
#
# The verify jobs call the same entry point as GitHub CI, scripts/verify-all.sh,
# which is the single definition of every mechanical invariant in this
# repository. Keep the two in step: a check that exists in only one of them will
# be discovered by whoever is unlucky enough to push to the other.

stages:
  - verify
  - review

verify-all:
  stage: verify
  image: node:24-alpine3.21
  variables:
    # scripts/check-size.ts and check-no-binaries.ts read tracked files via
    # `git ls-files`, and the test suites create throwaway git repositories
    # under .tmp/. A full clone keeps both honest, the same reason the GitHub
    # workflow sets fetch-depth: 0.
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    # The node alpine image is minimal; verify-all.sh and the suites it
    # discovers need git and a POSIX shell.
    - apk add --no-cache git
    # devDependencies only (a YAML parser for the template-parse suite); the
    # validators themselves are dependency-free.
    - npm ci
  script:
    - sh scripts/verify-all.sh

# Advisory rather than gating: the CLI arrives over the network at job time, so
# a registry or CDN hiccup must not block a merge the verify-all job already
# vouches for.
validate-manifest:
  stage: verify
  image: node:24-alpine3.21
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    # The npm registry install carries integrity metadata, unlike a piped script.
    - npm install -g @anthropic-ai/claude-code
  script:
    - claude plugin validate .

# Automated code review on every non-draft merge request.
#
# CI/CD variables under Settings > CI/CD > Variables:
#   ANTHROPIC_API_KEY       the Claude API key (required, masked)
#   GITLAB_ACCESS_TOKEN     project access token with the api scope (optional,
#                           masked). With it, findings post to the merge request
#                           via glab; without it, the review prints to the job
#                           log only, because CI_JOB_TOKEN cannot create merge
#                           request notes.
#   CLAUDE_MAX_BUDGET_USD   spend ceiling for one review (optional, not masked).
#                           Defaults to 5.00 when unset. Set it per project to
#                           raise or lower the cap without editing this file.
# Do not expose the two masked variables to pipelines from forks.
#
# The /bin/gitlab-mcp-server binary that GitLab's Duo-enabled runner images
# provide is not present on standard Docker runners, so this job posts through
# glab instead of the mcp__gitlab tools.
.code-review-base:
  stage: review
  image: node:24-alpine3.21
  variables:
    GIT_DEPTH: "0"
    # blocking: post only what blocks the merge. all: every severity.
    REVIEW_DEPTH: "blocking"
    GLAB_VERSION: "1.113.0"
    GLAB_SHA256_AMD64: "c265589fb2018f310b6a27df9356efee42991f858e7e3a5fa232228a13b47467"
    GLAB_SHA256_ARM64: "0c4cab3b35f7641e7955492b9491d7070698a958f0dfcb49d989e71bd78793c2"
    # glab reads its token from the environment: it accepts GITLAB_TOKEN,
    # GITLAB_ACCESS_TOKEN, or OAUTH_TOKEN, and says so itself when one is set
    # ("WARNING: One of GITLAB_TOKEN, GITLAB_ACCESS_TOKEN, OAUTH_TOKEN
    # environment variables is set"). No auth login step is needed. A
    # self-managed instance also needs the host.
    GITLAB_HOST: "$CI_SERVER_HOST"
    # Review cost and latency knobs. Opus is the strongest reviewer and the
    # reason the spend ceiling is set where it is; claude-sonnet-5 reviews a
    # typical merge request faster and cheaper if that trade suits the project.
    CLAUDE_MODEL: "claude-opus-5"
    CLAUDE_EFFORT: "medium"
    # CLAUDE_MAX_BUDGET_USD is deliberately not set here. GitLab ranks a project
    # variable above a job variable, so a project setting would win either way -
    # but leaving it undeclared keeps one obvious place to look for the value.
    # The script applies the default below when the project sets nothing.
  before_script:
    - apk add --no-cache git bash curl jq
    - mkdir -p .tmp
    # Alpine's packaged glab lags far behind releases; install a pinned,
    # checksum-verified build from the official release, matching the runner's
    # architecture rather than assuming amd64.
    - |
      case "$(uname -m)" in
        x86_64)  GLAB_ARCH=amd64; GLAB_SHA256="$GLAB_SHA256_AMD64" ;;
        aarch64) GLAB_ARCH=arm64; GLAB_SHA256="$GLAB_SHA256_ARM64" ;;
        *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL -o .tmp/glab.tar.gz "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_${GLAB_ARCH}.tar.gz"
      echo "${GLAB_SHA256}  .tmp/glab.tar.gz" | sha256sum -c -
      tar -xzf .tmp/glab.tar.gz -C /usr/local bin/glab
    # The npm registry install carries integrity metadata, unlike a piped script.
    - npm install -g @anthropic-ai/claude-code
  script:
    - |
      # Both review jobs run only in merge request pipelines, where these are
      # set. A pipeline started any other way has no merge request to review.
      if [ -z "${CI_MERGE_REQUEST_IID:-}" ]; then
        echo "no merge request in scope; nothing to review."
        exit 0
      fi

      SOURCE_BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      TARGET_BRANCH="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

      # Branch names reach the model's prompt; reject anything outside a
      # conservative character set rather than forwarding attacker-shaped input.
      case "$SOURCE_BRANCH$TARGET_BRANCH" in
        *[!A-Za-z0-9._/-]*) echo "branch name outside [A-Za-z0-9._/-]; refusing to review"; exit 1 ;;
      esac

      if [ "$REVIEW_DEPTH" = "all" ]; then
        POSTING_MODE="thorough - post findings at any severity"
      else
        POSTING_MODE="blocking-only"
      fi

      # The reviewer needs the diff range whether or not it can post, so derive
      # it from the predefined merge request variables and prefer the API's
      # copy when a token makes that available: those values are what the
      # discussion positions are validated against.
      DIFF_REFS=$(jq -nc --arg base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" \
                        --arg head "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}" \
                        '{base_sha: $base, head_sha: $head, start_sha: $base}')
      if [ -n "${GITLAB_ACCESS_TOKEN:-}" ]; then
        FROM_API=$(glab api "projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID" | jq -c '.diff_refs // empty')
        [ -n "$FROM_API" ] && DIFF_REFS="$FROM_API"
      else
        CAN_POST=""
        POSTING_MODE="$POSTING_MODE (no posting credentials in this job; findings go to the job log)"
      fi

      # Precompute the diff rather than letting the reviewer run git. `git diff`
      # and `git log` both accept --output=<file>, so granting either as a
      # "read-only" command in fact grants arbitrary file writes -- enough to
      # overwrite the posting script that runs after the reviewer exits, with
      # the token in its environment. The reviewer therefore gets no shell at
      # all, and reads the change from a file.
      #
      # The diff comes from the API, not the clone. A merge request pipeline
      # checks out the merge request ref alone, so the commits a local
      # `git diff base...head` needs are not reliably present -- and when they
      # are not, git writes an empty file and the reviewer silently reviews
      # nothing. The API's diff is also the one the discussion positions are
      # validated against, so it is the correct input in any case.
      : > .tmp/diff.patch
      if [ -n "${GITLAB_ACCESS_TOKEN:-}" ]; then
        glab api --paginate "projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/diffs?per_page=100" \
          | jq -s 'add // []' \
          | jq -r '.[] | "diff --git a/\(.old_path) b/\(.new_path)\n--- \(if .new_file then "/dev/null" else "a/" + .old_path end)\n+++ \(if .deleted_file then "/dev/null" else "b/" + .new_path end)\n\(.diff)"' \
          > .tmp/diff.patch
      else
        # No token: fall back to the clone, which is best-effort by nature.
        BASE_SHA=$(printf '%s' "$DIFF_REFS" | jq -r '.base_sha')
        HEAD_SHA=$(printf '%s' "$DIFF_REFS" | jq -r '.head_sha')
        git fetch --no-tags -q origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" 2>/dev/null || true
        git diff "origin/${TARGET_BRANCH}...HEAD" > .tmp/diff.patch 2>/dev/null \
          || git diff "${BASE_SHA}...${HEAD_SHA}" > .tmp/diff.patch 2>/dev/null \
          || : > .tmp/diff.patch
      fi
      echo "review: diff is $(wc -l < .tmp/diff.patch) lines."

      # An empty diff means the diff could not be read, not that the change is
      # empty: GitLab does not run this pipeline without one. Fail rather than
      # ask the model to review nothing and report the resulting silence as a
      # clean review. The job is allow_failure, so this reports without blocking.
      if [ ! -s .tmp/diff.patch ]; then
        echo "review: could not read the merge request diff; refusing to review nothing." >&2
        exit 1
      fi

      {
        echo "Merge request: !$CI_MERGE_REQUEST_IID ($SOURCE_BRANCH into $TARGET_BRANCH)"
        echo "Project id: $CI_PROJECT_ID"
        echo "Diff refs: $DIFF_REFS"
        echo "Posting mode: $POSTING_MODE"
        echo
        cat .gitlab/code-review-prompt.md
      } > .tmp/review-prompt.md

      # The reviewer runs read-only and returns findings as data; the pipeline
      # posts them. It holds no credential, no writes, and no posting command,
      # so the untrusted diff it reads cannot reach the project's API -- and
      # cannot rewrite the thing that does the posting either.
      # Unset every variable glab accepts as a token, not just the one this job
      # sets: a group-level GITLAB_TOKEN or OAUTH_TOKEN would otherwise reach
      # the reviewer, where an allowed command could expand it into output.
      #
      # --safe-mode disables every customization loaded from the working tree --
      # hooks, skills, plugins, MCP servers, custom commands and agents. That
      # tree is the merge request's: a hook declared in .claude/settings.json
      # would otherwise run inside this job, which holds the tokens the reviewer
      # is deliberately denied. Built-in tools and permissions are unaffected,
      # and the reviewer's guidance is read explicitly from REVIEW.md rather
      # than discovered.
      env -u GITLAB_ACCESS_TOKEN -u GITLAB_TOKEN -u OAUTH_TOKEN \
      claude \
        -p "$(cat .tmp/review-prompt.md)" \
        --safe-mode \
        --model "$CLAUDE_MODEL" \
        --effort "$CLAUDE_EFFORT" \
        --max-budget-usd "${CLAUDE_MAX_BUDGET_USD:-5.00}" \
        --allowedTools "Read Grep Glob" \
        --output-format json \
        --json-schema "$(cat .gitlab/code-review-schema.json)" \
        --max-turns 30 \
        > .tmp/claude-out.json

      # --output-format json wraps the answer in an envelope that is sometimes a
      # single object and sometimes an array of messages. The schema-validated
      # answer is `structured_output`; `result` is the free-form text, which
      # happens to hold the same JSON but only by convention.
      jq '(if type == "array" then .[-1] else . end)
          | (.structured_output // .result)
          | if type == "string" then fromjson else . end' \
        .tmp/claude-out.json > .tmp/findings.json

      if [ -z "${CAN_POST-yes}" ]; then
        echo "no posting credentials in this job; findings follow."
        jq -r ".findings[] | \"--- \\(.path)\\(if .line then \":\\(.line)\" else \"\" end) ---\\n\\(.body)\\n\"" .tmp/findings.json
        exit 0
      fi

      printf '%s' "$DIFF_REFS" > .tmp/diff-refs.json
      .gitlab/post-review-findings.sh .tmp/findings.json .tmp/diff-refs.json
  # Bounds a task that turns out harder than expected.
  timeout: 20m
  # A probabilistic reviewer must never block a merge.
  allow_failure: true
  # A new push supersedes an in-flight review.
  interruptible: true

# The automatic pass on every merge request. Quiet by design: only findings that
# block the merge are posted, so the review stays something people leave on.
code-review:
  extends: .code-review-base
  rules:
    # Draft merge requests are not reviewed. CI_MERGE_REQUEST_DRAFT needs
    # GitLab 17.10+; the title check covers older instances.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^Draft:/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# The deep pass, one click from the merge request's pipeline widget when a
# change warrants it. Reports at every severity.
code-review:deep:
  extends: .code-review-base
  variables:
    REVIEW_DEPTH: "all"
    CLAUDE_EFFORT: "high"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
