# GitLab CI mirror of .github/workflows/ci.yml, plus the merge-request review job.
#
# The verify jobs call the same entry point as GitHub CI, scripts/verify-all.sh,
# which is the single definition of every mechanical invariant in this
# repository. Keep the two in step: a check that exists in only one of them will
# be discovered by whoever is unlucky enough to push to the other.

stages:
  - verify
  - review

verify-all:
  stage: verify
  image: oven/bun:latest
  variables:
    # scripts/check-size.ts and check-no-binaries.ts read tracked files via
    # `git ls-files`, and the test suites create throwaway git repositories
    # under .tmp/. A full clone keeps both honest, the same reason the GitHub
    # workflow sets fetch-depth: 0.
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    # The bun image is Debian-based but minimal; verify-all.sh and the suites it
    # discovers need git and a POSIX shell.
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - sh scripts/verify-all.sh

# Advisory rather than gating: the CLI arrives over the network at job time, so
# a registry or CDN hiccup must not block a merge the verify-all job already
# vouches for.
validate-manifest:
  stage: verify
  image: oven/bun:latest
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl >/dev/null
    - curl -fsSL https://claude.ai/install.sh | bash
    # The installer places claude in ~/.local/bin, which is not on PATH here.
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - claude plugin validate .

# Automated code review on every non-draft merge request. The job's Claude Code
# process posts merge request comments itself through the mcp__gitlab tools, so
# no posting script is involved.
#
# Requires a masked CI/CD variable under Settings > CI/CD > Variables:
#   ANTHROPIC_API_KEY   the Claude API key
# Do not expose it to pipelines from forks.
code-review:
  stage: review
  image: node:24-alpine3.21
  rules:
    # Draft merge requests are not reviewed. CI_MERGE_REQUEST_DRAFT needs
    # GitLab 17.10+; the title check covers older instances.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^Draft:/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git curl bash
    - curl -fsSL https://claude.ai/install.sh | bash
    # The installer places claude in ~/.local/bin, which is not on PATH here.
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    # Supplies the mcp__gitlab tools inside the job. This runner binary is not
    # the HTTP MCP server at /api/v4/mcp.
    - /bin/gitlab-mcp-server || true
    - >
      claude
      -p "Review this merge request following the guidance in REVIEW.md and ACT_CODE_REVIEW.md,
      including any file they reference with @. Report only findings that name a concrete failure
      scenario and cite path:line. Post them on the merge request, one comment per unique issue,
      with a summary note. Modify no files."
      --allowedTools "Read Grep Glob mcp__gitlab"
      --max-turns 25
  # Bounds a task that turns out harder than expected.
  timeout: 20m
  # A probabilistic reviewer must never block a merge.
  allow_failure: true
  # A new push supersedes an in-flight review.
  interruptible: true
